<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>减肥互助社群（云端多人Demo）</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    * {box-sizing:border-box;}
    body { font-family: system-ui, -apple-system; padding:16px; background:#f7f8fa; margin:0; }
    .card { background:#fff; border-radius:12px; padding:20px; max-width:720px; box-shadow:0 2px 12px #00000012; margin:12px 0; }
    input,textarea,select { width:100%; padding:12px; font-size:16px; border:1px solid #ddd; border-radius:8px; margin:8px 0; }
    button { padding:11px 16px; border:none; border-radius:8px; cursor:pointer; font-size:15px; margin:4px; }
    .btn-primary { background:#2563eb; color:white; }
    .btn-danger { background:#dc2626; color:white; }
    .btn-gray { background:#9ca3af; color:white; }
    .btn-success { background:#16a34a; color:white; }
    .order-item { border:1px solid #e5e7eb; border-radius:10px; padding:14px; margin:10px 0; }
    .mask { position:fixed; inset:0; background:rgba(0,0,0,0.55); display:flex; align-items:center; justify-content:center; padding:12px; z-index:99; }
    .modal { background:white; border-radius:12px; max-width:520px; width:100%; padding:22px; max-height:85vh; overflow:auto; }
    .hide { display:none !important; }
    .tip-toast { position:fixed; top:16px; right:16px; background:#1f2937; color:#fff; padding:12px 18px; border-radius:8px; z-index:200; }
    .tag-open {color:#16a34a;font-weight:500;}
    .tag-taken {color:#2563eb;font-weight:500;}
    .tag-cancelled {color:#9ca3af;}
    .tag-completed {color:#9333ea;}
  </style>
</head>
<body>
<div id="app"></div>

<script>
// ========== Supabase配置，填入你的信息 ==========
const SUPABASE_URL = "https://dhczdfkoctgoeyiufmqb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_peh0tyV_qeXH5cjaRIx7-Q_W7aeKhm5";
const supabase = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);

// 全局状态
let state = {
  currentUser: null,
  agreeSafety: false
};

// toast提示
function showToast(msg){
  const el = document.createElement('div');
  el.className = "tip-toast";
  el.innerText = msg;
  document.body.appendChild(el);
  setTimeout(()=>el.remove(),2200);
}

// 生成随机userId，防止昵称撞号
function genUserId(){
  return "u_" + Math.random().toString(36).slice(2) + Date.now().toString(36);
}

// 渲染登录页
function renderLogin(){
  document.getElementById('app').innerHTML = `
  <div class="card">
    <h2>减肥互助社群｜登录</h2>
    <p>输入昵称即可进入内测（无需密码）</p>
    <input id="usernameInput" placeholder="输入你的昵称" />
    <button class="btn-primary" id="loginBtn">登录</button>
  </div>
  `;
  document.getElementById('loginBtn').onclick = async ()=>{
    const name = document.getElementById('usernameInput').value.trim();
    if(!name){ showToast("请输入昵称");return; }
    // 查询是否存在该用户名
    const {data:userList} = await supabase.from('app_users').select('*').eq('username',name);
    let user;
    if(userList && userList.length>0){
      user = userList[0];
    }else{
      const newId = genUserId();
      const {data} = await supabase.from('app_users').insert([{id:newId, username:name,is_admin:false}]).select();
      user = data[0];
    }
    state.currentUser = user;
    localStorage.setItem("fit_user",JSON.stringify(user));
    renderSafetyModal();
  }
}

// 安全协议弹窗
function renderSafetyModal(){
  document.getElementById('app').innerHTML = `
  <div class="mask">
    <div class="modal">
      <h3>减肥安全约定</h3>
      <div style="max-height:320px;overflow:auto;">
        <p>1.本平台仅为互助社群Demo，不提供医疗建议。</p>
        <p>2.禁止制定极端节食、过度运动等伤害身体的减肥目标。</p>
        <p>3.若身体不适，请立刻停止减肥计划并咨询医生。</p>
        <p>4.所有目标由用户自行承担风险，平台不承担健康责任。</p>
        <p>5.本版本仅用于朋友内测，请勿用于商业用途。</p>
      </div>
      <br/>
      <button class="btn-success" id="agreeBtn">我已阅读并同意约定</button>
    </div>
  </div>
  `;
  document.getElementById('agreeBtn').onclick = ()=>{
    state.agreeSafety = true;
    localStorage.setItem("fit_agree","1");
    renderMain();
  }
}

// 获取状态文本
function getStatusText(s){
  const map = {
    open:"开放接单",
    taken:"已被接单",
    completed:"已完成",
    cancelled:"已取消"
  }
  return map[s]||s;
}
function getStatusClass(s){
  const map = {
    open:"tag-open",
    taken:"tag-taken",
    completed:"tag-completed",
    cancelled:"tag-cancelled"
  }
  return map[s]||"";
}

// 主页面
async function renderMain(){
  const user = state.currentUser;
  document.getElementById('app').innerHTML = `
  <div class="card">
    <h3>👋 ${user.username}</h3>
    <p>用户ID:${user.id}</p>
    <button class="btn-danger" id="logoutBtn">退出登录</button>
  </div>

  <div class="card">
    <h4>新建减肥目标订单</h4>
    <input placeholder="标题" id="o_title"/>
    <textarea placeholder="目标描述" id="o_desc"></textarea>
    <input placeholder="当前体重" id="o_cur" type="number" step="0.1"/>
    <input placeholder="目标体重" id="o_tar" type="number" step="0.1"/>
    <input placeholder="截止日期 YYYY-MM-DD" id="o_dead"/>
    <button class="btn-primary" id="createOrderBtn">发布订单</button>
  </div>

  <div class="card">
    <h4>体重打卡</h4>
    <input placeholder="本次体重" id="log_w" type="number" step="0.1"/>
    <textarea placeholder="备注" id="log_note"></textarea>
    <button class="btn-success" id="submitLogBtn">提交打卡</button>
    <div id="logListWrap"></div>
  </div>

  <div class="card">
    <h4>全部互助订单</h4>
    <div id="orderListWrap"></div>
  </div>
  `;

  // 退出登录
  document.getElementById('logoutBtn').onclick = ()=>{
    localStorage.removeItem("fit_user");
    localStorage.removeItem("fit_agree");
    state.currentUser=null;state.agreeSafety=false;
    renderLogin();
  }

  // 创建订单
  document.getElementById('createOrderBtn').onclick = async ()=>{
    const title = document.getElementById('o_title').value.trim();
    const desc = document.getElementById('o_desc').value.trim();
    const cur_w = Number(document.getElementById('o_cur').value);
    const tar_w = Number(document.getElementById('o_tar').value);
    const deadline = document.getElementById('o_dead').value.trim();
    if(!title||!cur_w||!tar_w||!deadline){ showToast("请填完整信息");return; }
    const orderId = "ord_"+Date.now().toString(36)+Math.random().toString(36).slice(2);
    const {error} = await supabase.from('orders').insert([{
      order_id:orderId,
      creator_id:user.id,
      creator_name:user.username,
      helper_id:null,
      helper_name:null,
      title,
      description:desc,
      safety_agreement:"已同意社群减肥安全约定",
      cur_w,tar_w,deadline,
      deposit:0,
      status:"open"
    }])
    if(error){ showToast("发布失败:"+error.message); }else{
      showToast("订单发布成功");
      loadOrders();
    }
  }

  // 提交打卡
  document.getElementById('submitLogBtn').onclick = async ()=>{
    const w = Number(document.getElementById('log_w').value);
    const note = document.getElementById('log_note').value.trim();
    if(!w){ showToast("填写体重");return; }
    const {error} = await supabase.from('weight_logs').insert([{
      user_id:user.id,
      weight:w,
      note:note
    }])
    if(error){ showToast("打卡失败:"+error.message); }else{
      showToast("打卡成功");
      loadLogs();
    }
  }

  loadOrders();
  loadLogs();
}

// 加载订单
async function loadOrders(){
  const {data:orders,error} = await supabase.from('orders').select('*').order('create_at',{asc:false});
  if(error) return;
  const wrap = document.getElementById('orderListWrap');
  if(!orders||orders.length===0){ wrap.innerHTML="<p>暂无订单</p>";return; }
  let html = "";
  for(const o of orders){
    html += `
    <div class="order-item">
      <div><b>${o.title}</b> <span class="${getStatusClass(o.status)}">[${getStatusText(o.status)}]</span></div>
      <div>创建人：${o.creator_name}</div>
      <div>体重：${o.cur_w} → ${o.tar_w}｜截止：${o.deadline}</div>
      <div>${o.description||""}</div>
      ${o.helper_name?`<div>协助人：${o.helper_name}</div>`:""}
      <div>
      ${(o.status==='open' && o.creator_id!==state.currentUser.id)?
        `<button class="btn-primary" onclick="takeOrder('${o.order_id}')">接单互助</button>`:""}
      ${(o.creator_id===state.currentUser.id && o.status==='taken')?
        `<button class="btn-success" onclick="completeOrder('${o.order_id}')">标记完成</button>`:""}
      ${(o.creator_id===state.currentUser.id && o.status==='open')?
        `<button class="btn-gray" onclick="cancelOrder('${o.order_id}')">取消订单</button>`:""}
      </div>
    </div>
    `
  }
  wrap.innerHTML = html;
}

// 接单
window.takeOrder = async function(orderId){
  const u = state.currentUser;
  const {error} = await supabase.from('orders').update({
    status:"taken",
    helper_id:u.id,
    helper_name:u.username
  }).eq("order_id",orderId);
  if(error){ showToast("接单失败:"+error.message); }else{
    showToast("接单成功"); loadOrders();
  }
}
// 完成
window.completeOrder = async function(orderId){
  const {error} = await supabase.from('orders').update({status:"completed"}).eq("order_id",orderId);
  if(error){ showToast("更新失败:"+error.message); }else{ showToast("标记完成");loadOrders(); }
}
//取消
window.cancelOrder = async function(orderId){
  const {error} = await supabase.from('orders').update({status:"cancelled"}).eq("order_id",orderId);
  if(error){ showToast("取消失败:"+error.message); }else{ showToast("已取消");loadOrders(); }
}

//加载打卡
async function loadLogs(){
  const uid = state.currentUser.id;
  const {data:logs} = await supabase.from('weight_logs').select('*').eq('user_id',uid).order('created_at',{asc:false});
  const wrap = document.getElementById('logListWrap');
  if(!logs||logs.length===0){ wrap.innerHTML="<p>暂无打卡记录</p>";return; }
  let h = `<h4>我的打卡记录</h4>`;
  logs.forEach(l=>{
    const t = new Date(l.created_at).toLocaleString();
    h += `<div style="padding:6px 0;border-bottom:1px solid #eee;">
      ${t}｜体重:${l.weight} ${l.note?"备注:"+l.note:""}
    </div>`
  })
  wrap.innerHTML = h;
}

//初始化
async function init(){
  const savedUser = localStorage.getItem("fit_user");
  const savedAgree = localStorage.getItem("fit_agree");
  if(savedUser && savedAgree==="1"){
    state.currentUser = JSON.parse(savedUser);
    state.agreeSafety = true;
    renderMain();
  }else{
    renderLogin();
  }
}
init();
</script>
</body>
</html>
