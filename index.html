<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <title>减肥互助社群（云端多人Demo）</title>
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <style>
    body { font-family: system-ui; padding:24px; background:#f7f8fa; margin:0; }
    .card { background:#fff; border-radius:12px; padding:24px; max-width:780px; box-shadow:0 2px 12px #00000012; margin-bottom:20px; }
    input { width:100%; box-sizing:border-box; padding:12px; font-size:16px; border:1px solid #ddd; border-radius:8px; margin:8px 0 12px; }
    textarea { width:100%; box-sizing:border-box; padding:12px; font-size:16px; border:1px solid #ddd; border-radius:8px; margin:8px 0 12px; min-height:80px; }
    button { background:#2b65ec; color:white; border:none; border-radius:8px; padding:10px 22px; font-size:16px; cursor:pointer; margin:4px; }
    button.secondary { background:#888; }
    button.danger { background:#dc2626; }
    button.success { background:#059669; }
    .hide { display:none !important; }
    .order-item { border:1px solid #e5e7eb; border-radius:10px; padding:16px; margin:12px 0; }
    .status-open {color:#059669;}
    .status-taken {color:#2563eb;}
    .status-completed {color:#7c3aed;}
    .status-cancelled {color:#dc2626;}
    .log-item {
      background:#f7f8fa;
      padding:8px 12px;
      border-radius:6px;
      margin:4px 0;
      font-size:14px;
    }

    /* 安全协议弹窗样式 */
    .modal-overlay {
      position: fixed;
      inset:0;
      background:rgba(0,0,0,0.6);
      display:flex;
      align-items:center;
      justify-content:center;
      z-index:9999;
    }
    .modal-box {
      background:white;
      width:90%;
      max-width:520px;
      border-radius:12px;
      padding:24px;
    }
    .modal-text {
      max-height:260px;
      overflow-y:auto;
      padding:8px;
      border:1px solid #eee;
      margin:16px 0;
    }
  </style>
</head>
<body>
<h1>🏃减肥互助社群（云端多人Demo）</h1>

<div id="loginPage" class="card">
  <h2>进入社群</h2>
  <input id="username" placeholder="输入你的昵称">
  <br>
  <button onclick="handleLogin()">登录社群</button>
  <p style="font-size:13px;color:#666">管理员需要在supabase后台把app_users表is_admin设置为true</p>
</div>

<div id="mainPage" class="card hide">
  <h2>欢迎，<span id="showName"></span></h2>
  <button onclick="logout()">退出登录</button>
  <hr>

  <h3>📝发布减肥目标订单</h3>
  <input id="orderTitle" placeholder="订单标题：例如：2个月减重8kg">
  <textarea id="orderDesc" placeholder="目标描述，你的计划、注意事项..."></textarea>
  <input id="curWeight" placeholder="当前体重" type="number" step="0.1">
  <input id="tarWeight" placeholder="目标体重" type="number" step="0.1">
  <input id="deadline" type="date">
  <button onclick="createOrder()">创建目标订单</button>

  <hr>
  <div style="display:flex;gap:8px;">
    <button onclick="fetchAllOpenOrders()">浏览全部开放订单</button>
    <button onclick="fetchMyOrders()">我的订单</button>
  </div>

  <div id="orderListWrap"></div>
</div>

<!-- 安全协议弹窗 默认隐藏 -->
<div id="safetyModal" class="modal-overlay hide">
  <div class="modal-box">
    <h3>⚠️减肥互助安全协议</h3>
    <div class="modal-text">
<p>1. 参与本平台减肥互助，禁止使用极端节食、催吐、过量运动等伤害身体的减重手段。</p>
<p>2. 协助人给出的减肥建议仅供参考，身体不适请立刻停止并咨询医生。</p>
<p>3. 如果双方对方案产生分歧，可以申请平台仲裁。</p>
<p>4. 用户需要对自己的身体健康负全部责任，平台不承担健康损伤相关责任。</p>
<p>5. 创建订单即代表你认可以上全部条款。</p>
    </div>
    <button id="btnAgree">我已阅读并同意协议</button>
    <button class="secondary" id="btnDisagree">拒绝（退出登录）</button>
  </div>
</div>

<script>
const SUPABASE_URL = "https://dhczdfkoctgoeyiufmqb.supabase.co";
const SUPABASE_ANON_KEY = "sb_publishable_peh0tyV_qeXH5cjaRIx7-Q_W7aeKhm5";
const client = window.supabase.createClient(SUPABASE_URL, SUPABASE_ANON_KEY);
let currentUser = null;
const DEFAULT_SAFETY_AGREEMENT = "双方承诺不使用极端节食、伤害身体的减肥方案；出现分歧可申请平台仲裁。";

// =========安全弹窗逻辑=========
const safetyModal = document.getElementById("safetyModal");
document.getElementById("btnAgree").addEventListener("click", function(){
  safetyModal.classList.add("hide");
  localStorage.setItem("userAgreeSafety","true");
});
document.getElementById("btnDisagree").addEventListener("click", function(){
  alert("不同意协议将退出登录");
  logout();
});
function showSafetyModal(){
  safetyModal.classList.remove("hide");
}

// =========登录逻辑=========
async function handleLogin(){
  const usernameInput = document.getElementById("username").value.trim();
  if(!usernameInput){ alert("请输入昵称"); return; }
  try{
    const {data:userList, error:selErr} = await client
      .from("app_users")
      .select("*")
      .eq("username", usernameInput);

    if(selErr) throw selErr;
    let user = null;
    if (userList && userList.length > 0) {
      user = userList[0];
    } else {
      const newId = "u_"+Date.now();
      const {data:newUser, error:insErr} = await client.from("app_users")
        .insert([{id:newId, username:usernameInput, is_admin:false}])
        .select().single();
      if(insErr) throw insErr;
      user = newUser;
    }
    localStorage.setItem("currentUser", JSON.stringify(user));
    currentUser = user;
    renderMain();
  }catch(e){
    console.error(e);
    alert("登录失败："+e.message);
  }
}

function renderMain(){
  document.getElementById("loginPage").classList.add("hide");
  document.getElementById("mainPage").classList.remove("hide");
  document.getElementById("showName").innerText = currentUser.username;
  if(localStorage.getItem("userAgreeSafety") !== "true"){
    showSafetyModal();
  }
}

function logout(){
  localStorage.removeItem("currentUser");
  localStorage.removeItem("userAgreeSafety");
  location.reload();
}

// =========订单操作：接单、取消、完成=========
async function createOrder(){
  if(localStorage.getItem("userAgreeSafety") !== "true"){
    showSafetyModal();
    return;
  }
  const title = document.getElementById("orderTitle").value.trim();
  const desc = document.getElementById("orderDesc").value.trim();
  const curW = Number(document.getElementById("curWeight").value);
  const tarW = Number(document.getElementById("tarWeight").value);
  const deadline = document.getElementById("deadline").value;
  if(!title || !curW || !tarW || !deadline){
    alert("请填全标题、体重、截止日期");
    return;
  }
  const orderId = "o_"+Date.now();
  const payload = {
    order_id: orderId,
    creator_id: currentUser.id,
    creator_name: currentUser.username,
    helper_id: null,
    helper_name: null,
    title: title,
    description: desc,
    safety_agreement: DEFAULT_SAFETY_AGREEMENT,
    cur_w: curW,
    tar_w: tarW,
    deadline: deadline,
    deposit: 0,
    status:"open"
  };
  const {error} = await client.from("orders").insert([payload]);
  if(error){ alert("创建失败："+error.message); return; }
  alert("订单创建成功！");
  document.getElementById("orderTitle").value="";
  document.getElementById("orderDesc").value="";
  document.getElementById("curWeight").value="";
  document.getElementById("tarWeight").value="";
  document.getElementById("deadline").value="";
  fetchAllOpenOrders();
}

async function takeOrder(orderObj){
  if(orderObj.status !== "open"){ alert("该订单不可接单"); return; }
  if(orderObj.creator_id === currentUser.id){ alert("不能接自己发布的订单"); return; }
  const {error}=await client.from("orders")
    .update({
      status:"taken",
      helper_id:currentUser.id,
      helper_name:currentUser.username
    })
    .eq("order_id", orderObj.order_id);
  if(error){alert("接单失败："+error.message);return;}
  alert("✅接单成功！");
  fetchMyOrders();
}

async function cancelOrder(orderObj){
  if(!confirm("确定要取消该订单吗？")) return;
  const {error}=await client.from("orders")
    .update({status:"cancelled"})
    .eq("order_id", orderObj.order_id);
  if(error){alert("取消失败："+error.message);return;}
  alert("订单已取消");
  fetchMyOrders();
}

async function completeOrder(orderObj){
  if(!confirm("确认标记该订单为已完成？")) return;
  const {error}=await client.from("orders")
    .update({status:"completed"})
    .eq("order_id", orderObj.order_id);
  if(error){alert("完成失败："+error.message);return;}
  alert("🎉订单标记完成");
  fetchMyOrders();
}

// =========体重打卡新增功能========
async function addWeightLog(orderId){
  const logWeight = prompt("输入本次记录体重：");
  if(!logWeight) return;
  const numW = parseFloat(logWeight);
  if(isNaN(numW)){ alert("体重数字格式错误"); return; }
  const note = prompt("备注（可选）：") || "";
  const logId = "wl_"+Date.now();
  const payload = {
    id: logId,
    order_id: orderId,
    user_id: currentUser.id,
    log_weight: numW,
    log_note: note
  };
  const {error}=await client.from("weight_logs").insert([payload]);
  if(error){ alert("打卡保存失败："+error.message); return; }
  fetchMyOrders();
}

async function getWeightLogs(orderId){
  const {data,error}=await client.from("weight_logs")
    .select("*")
    .eq("order_id",orderId)
    .order("log_date",{ascending:false});
  if(error) return [];
  return data;
}

async function fetchAllOpenOrders(){
  const {data,error}=await client.from("orders").select("*").eq("status","open").order("create_at",{ascending:false});
  if(error){alert(error.message);return;}
  renderOrderList(data,"全部开放订单");
}

async function fetchMyOrders(){
  const {data,error}=await client.from("orders").select("*")
    .or(`creator_id.eq.${currentUser.id},helper_id.eq.${currentUser.id}`)
    .order("create_at",{ascending:false});
  if(error){alert(error.message);return;}
  renderOrderList(data,"我的订单");
}

async function renderOrderList(list,headingText){
  const wrap = document.getElementById("orderListWrap");
  let html = `<h4>${headingText} (${list.length})</h4>`;
  for(const o of list){
    let statusClass = "";
    let statusText = o.status;
    if(o.status==="open") statusClass="status-open";
    if(o.status==="taken") statusClass="status-taken";
    if(o.status==="completed") statusClass="status-completed";
    if(o.status==="cancelled") statusClass="status-cancelled";

    html += `<div class="order-item">
      <div><strong>${o.title}</strong> <span class="${statusClass}">[${statusText}]</span></div>
      <div>发布人：${o.creator_name}</div>
      <div>体重：${o.cur_w} → ${o.tar_w}</div>
      <div>截止：${o.deadline}</div>
      ${o.description ? `<div>描述：${o.description}</div>` : ""}
      ${o.helper_name ? `<div>协助人：${o.helper_name}</div>`:""}
      <div class="btn-group">`;

      // 接单按钮：开放订单，不是自己发的
      if(o.status==="open" && o.creator_id!==currentUser.id){
        html += `<button onclick='takeOrder(${JSON.stringify(o).replaceAll("'","\\'")})'>接单</button>`;
      }
      // 发布人操作
      if(o.creator_id === currentUser.id){
        if(o.status === "open" || o.status === "taken"){
          html += `<button class="danger" onclick='cancelOrder(${JSON.stringify(o).replaceAll("'","\\'")})'>取消订单</button>`;
        }
        if(o.status === "taken"){
          html += `<button class="success" onclick='completeOrder(${JSON.stringify(o).replaceAll("'","\\'")})'>标记完成</button>`;
        }
        // 只有订单创建人可以打卡；已完成/取消不允许打卡
        if(o.status === "open" || o.status === "taken"){
          html += `<button onclick='addWeightLog("${o.order_id}")'>📝记录体重打卡</button>`;
        }
      }
    html += `</div>`;

    // 读取并渲染该订单全部打卡记录
    const logs = await getWeightLogs(o.order_id);
    if(logs.length>0){
      html += `<div style="margin-top:10px;"><b>📊体重打卡记录(${logs.length})</b>`;
      logs.forEach(l=>{
        const dateStr = new Date(l.log_date).toLocaleString();
        html += `<div class="log-item">${dateStr}｜体重：${l.log_weight} ${l.log_note?"｜备注："+l.log_note:""}</div>`;
      })
      html += `</div>`;
    }
    html += `</div>`;
  }
  wrap.innerHTML = html;
}

window.onload = function(){
  const saved = localStorage.getItem("currentUser");
  if(saved){
    currentUser = JSON.parse(saved);
    renderMain();
  }
}
</script>
</body>
</html>
